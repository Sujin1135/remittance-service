services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: app-mysql
    depends_on:
      - app-mysql
  app-mysql:
    image: mysql:8.0
    restart: always
    container_name: remittance-mysql8
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: password123!
      MYSQL_DATABASE: remittance
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./data/mysql/:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/./subproject/infrastructure/src/main/resources/db/migration/V1_1__create_tables.sql